plugins {
    id 'com.android.application'
}

// Signature de la version publiée : clé d'importation fournie par les secrets GitHub (jamais dans le dépôt).
def ks = System.getenv('KEYSTORE_FILE')

android {
    namespace 'fr.pisteo.app'
    compileSdk 36

    defaultConfig {
        applicationId 'fr.pisteo.app'
        minSdk 26
        targetSdk 36
        versionCode 18
        versionName '2.3.1'
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
            resValue 'string', 'app_name', 'Pisteo'
        }
        debug {
            // version d'essai installable à côté de celle du Play Store
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            resValue 'string', 'app_name', 'Pisteo (essai)'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // sauvegarde Google Drive : autorisation Google (champ drive.appdata)
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    // aligne les versions de Kotlin tirées par les bibliothèques Google (sinon classes en double)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
