<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suivi en direct · Pisteo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1F2A24">
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="../vendor/maplibre-gl.css">
<style>
:root { --bg: #EEF1E8; --panel: #fff; --ink: #17201c; --muted: #5d6b63; --line: #dfe5dc; --go: #2F5E45; --go-ink: #2F5E45; --warn: #B26A00; --track: #F06A1F; }
@media (prefers-color-scheme: dark) { :root { --bg: #151c18; --panel: #1F2A24; --ink: #e8eee9; --muted: #9fb0a6; --line: #34433a; --go: #3D7A58; --go-ink: #7fd1a1; --warn: #F0B354; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, Roboto, sans-serif; }
#map { position: fixed; inset: 0; }
.card { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); max-width: 520px; margin: 0 auto; background: var(--panel); border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.22); padding: 14px 16px 12px; }
.top { display: flex; align-items: center; gap: 10px; }
.live { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--go-ink); box-shadow: 0 0 0 0 rgba(63,170,110,.6); animation: pulse 2s infinite; }
.live.old { background: var(--warn); animation: none; }
.live.off { background: var(--muted); animation: none; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(63,170,110,0); } 100% { box-shadow: 0 0 0 0 rgba(63,170,110,0); } }
h1 { margin: 0; font-size: 17px; font-weight: 650; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.when { margin: 4px 0 8px; color: var(--muted); font-size: 13.5px; }
.when.old { color: var(--warn); }
.stats { display: flex; gap: 18px; flex-wrap: wrap; }
.stats div { display: flex; flex-direction: column; }
.stats span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stats b { font-size: 18px; font-variant-numeric: tabular-nums; }
.acts { display: flex; gap: 8px; margin-top: 12px; }
.acts a, .acts button { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 42px; border-radius: 12px; border: 1px solid var(--line); background: none; color: var(--ink); font: 600 14px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
.acts .go { background: var(--go); border-color: var(--go); color: #fff; }
.foot { margin-top: 10px; font-size: 12px; color: var(--muted); text-align: center; }
.foot a { color: var(--muted); }
.msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
.me { width: 22px; height: 22px; border-radius: 50%; background: #2F7DE1; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(47,125,225,.25), 0 2px 6px rgba(0,0,0,.3); }
.me.old { background: #8a8f94; box-shadow: 0 0 0 6px rgba(138,143,148,.25), 0 2px 6px rgba(0,0,0,.3); }
</style>
</head><body>
<div id="map"></div>
<div id="card" class="card" hidden>
  <div class="top"><i id="dot" class="live"></i><h1 id="name">Suivi en direct</h1></div>
  <p id="when" class="when"></p>
  <div class="stats" id="stats"></div>
  <div class="acts">
    <button id="center">Recentrer</button>
    <a id="maps" class="go" target="_blank" rel="noopener">Y aller (Google Maps)</a>
  </div>
  <p class="foot">Mis à jour toutes les minutes · <a href="https://pisteo.app" target="_blank" rel="noopener">Pisteo</a></p>
</div>
<div id="msg" class="msg" hidden><p id="msgTxt"></p></div>
<script src="../vendor/maplibre-gl.js"></script>
<script>
(() => {
'use strict';
// Suivi en direct : https://pisteo.app/suivi/#<id> · la position vient du relais Pisteo (strava-relay/worker.js, routes /live)
const API = 'https://api.pisteo.app/live/';
const id = (location.hash.slice(1).match(/^[a-z0-9]{10}/) || [])[0];
const $ = i => document.getElementById(i);
const msg = t => { $('msgTxt').textContent = t; $('msg').hidden = false; $('card').hidden = true; };
if (!id) { msg('Lien de suivi incomplet : demande à la personne de te le renvoyer.'); return; }
const km = m => m == null ? '–' : m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(m < 10000 ? 1 : 0).replace('.', ',') + ' km';
const ago = ms => { const m = Math.round(ms / 6e4); return m < 1 ? 'à l\'instant' : m < 60 ? `il y a ${m} min` : `il y a ${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`; };
const hm = t => new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
const map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty', center: [2.5, 46.6], zoom: 5, attributionControl: { compact: true } });
let meMk = null, first = true, last = null;
const src = (k, coords) => { const g = { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } }; map.getSource(k) ? map.getSource(k).setData(g) : null; };
map.on('load', () => {
  for (const [k, color, w, dash] of [['line', '#F06A1F', 5, null], ['trail', '#2F7DE1', 4, null]]) {
    map.addSource(k, { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } } });
    map.addLayer({ id: k, type: 'line', source: k, layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': color, 'line-width': w, 'line-opacity': k === 'line' ? .75 : .95 } });
  }
  load(); setInterval(load, 60000);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
function fit(d) {
  const pts = (d.line && d.line.length ? d.line : []).concat(d.pos ? [[d.pos.lon, d.pos.lat]] : []);
  if (!pts.length) return;
  const b = pts.reduce((b, p) => b.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
  map.fitBounds(b, { padding: { top: 40, left: 30, right: 30, bottom: $('card').offsetHeight + 40 }, maxZoom: 15, duration: 0 });
}
async function load() {
  let d;
  try { const r = await fetch(API + id, { cache: 'no-store' }); d = await r.json(); if (!r.ok) { if (r.status === 404) msg('Ce suivi est terminé depuis plus d\'un jour, ou le lien est incorrect.'); return; } }
  catch { if (!last) msg('Pas de connexion. La page réessaie toute seule.'); return; }
  last = d; $('msg').hidden = true; $('card').hidden = false;
  document.title = (d.name || 'Sortie') + ' · Suivi en direct';
  $('name').textContent = d.name || 'Sortie';
  src('line', d.line || []); src('trail', (d.trail || []).map(p => [p[0], p[1]]));
  const p = d.pos, age = p ? d.now - p.t : null, old = age != null && age > 15 * 6e4;
  $('dot').className = 'live' + (d.ended ? ' off' : old || !p ? ' old' : '');
  $('when').className = 'when' + (old && !d.ended ? ' old' : '');
  $('when').textContent = d.ended ? (p ? `Partage terminé · dernière position à ${hm(p.t)}` : 'Partage terminé')
    : !p ? 'En attente de la première position (GPS)…'
    : `Dernière position ${ago(age)} (${hm(p.t)})` + (old ? ' · peut-être sans réseau' : '');
  const st = [];
  if (p && p.rem != null) st.push(['Restant', km(p.rem)]);
  if (p && p.along != null) st.push(['Parcouru', km(p.along)]);
  if (p && p.bat != null) st.push(['Batterie', p.bat + ' %']);
  $('stats').innerHTML = st.map(([a, b]) => `<div><span>${a}</span><b>${b}</b></div>`).join('');
  $('maps').hidden = !p;
  if (p) {
    $('maps').href = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;
    if (!meMk) { const e = document.createElement('div'); e.className = 'me'; meMk = new maplibregl.Marker({ element: e }).setLngLat([p.lon, p.lat]).addTo(map); }
    meMk.setLngLat([p.lon, p.lat]); meMk.getElement().classList.toggle('old', old || d.ended);
  }
  if (first) { first = false; fit(d); }
}
$('center').onclick = () => { if (!last) return; last.pos ? map.easeTo({ center: [last.pos.lon, last.pos.lat], zoom: Math.max(map.getZoom(), 14) }) : fit(last); };
})();
</script>
</body></html>
