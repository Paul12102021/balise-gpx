# Publication du site sur Cloudflare Pages (pisteo.app) à chaque modification poussée sur main.
# Secrets GitHub nécessaires : CLOUDFLARE_API_TOKEN (droit « Cloudflare Pages : Edit ») et CLOUDFLARE_ACCOUNT_ID.
name: Site pisteo.app
on:
  push:
    branches: [main]
    paths-ignore: ['android/**', 'strava-relay/**', 'README.md']
  workflow_dispatch:
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Clés Cloudflare présentes ?
        id: keys
        env: { T: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: if [ -n "$T" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::notice::Secrets Cloudflare absents : publication ignorée"; fi
      - uses: actions/setup-node@v5
        if: steps.keys.outputs.ok == '1'
        with: { node-version: 22 }
      - name: Préparer le site
        if: steps.keys.outputs.ok == '1'
        run: sh build.sh
      - name: Publier sur Cloudflare Pages
        if: steps.keys.outputs.ok == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create pisteo --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy dist --project-name=pisteo --branch=main --commit-dirty=true
